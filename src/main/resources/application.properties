spring.application.name=LostLink

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lostlink}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server Configuration
server.port=${PORT:8080}

# JWT Authentication Properties
jwt.secret=${JWT_SECRET:lostlink-secure-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-security}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Development Test Account Settings
dev.test-password=${DEV_TEST_PASSWORD:Password123!}
dev.reset-test-password-on-startup=${DEV_RESET_TEST_PASSWORD_ON_STARTUP:false}
dev.auth.test-reset-enabled=${DEV_AUTH_TEST_RESET_ENABLED:false}

# Logging Configuration
logging.file.name=${LOGGING_FILE:backend.log}